<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카페 메뉴 추천 테스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- 시작 화면 -->
    <section id="start-screen" class="screen active">
      <div class="hero-icon">☕</div>
      <h1>카페 메뉴 추천 테스트</h1>
      <p class="subtitle">몇 가지 질문에 답하면<br>지금 나에게 딱 맞는 메뉴를 알려드려요.</p>
      <button id="start-btn" class="btn primary">시작하기</button>
    </section>

    <!-- 질문 화면 -->
    <section id="question-screen" class="screen">
      <div class="chat-header">
        <div class="avatar">☕</div>
        <div class="chat-title">
          <strong>바리스타</strong>
          <span>취향 상담 중</span>
        </div>
        <span id="progress-text" class="progress-text">Q1</span>
      </div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="chat-log" class="chat-log"></div>
      <div id="options" class="replies"></div>
      <button id="back-btn" class="btn text">← 이전 질문</button>
    </section>

    <!-- 결과 화면 -->
    <section id="result-screen" class="screen">
      <p class="result-label">오늘의 추천 메뉴</p>
      <div id="result-emoji" class="result-emoji"></div>
      <h2 id="result-name" class="result-name"></h2>
      <span id="result-rate" class="result-rate"></span>
      <div class="reason">
        <h3>추천 이유</h3>
        <p id="result-reason"></p>
      </div>
      <div id="result-tags" class="tags"></div>
      <div class="alternatives">
        <h3>이것도 좋아요 <span class="opt-hint">누르면 이 메뉴로 바꿔 볼 수 있어요</span></h3>
        <div id="alt-list" class="alt-list"></div>
      </div>
      <button id="custom-btn" class="btn primary">커스텀하기</button>
      <button id="restart-btn" class="btn secondary">다시 하기</button>
    </section>

    <!-- 커스텀 화면 -->
    <section id="custom-screen" class="screen">
      <p class="result-label">나만의 음료 만들기</p>
      <h2 id="custom-name" class="result-name"></h2>
      <div id="custom-options" class="custom-options"></div>
      <button id="custom-done-btn" class="btn primary">완료</button>
      <button id="custom-back-btn" class="btn text">← 추천 결과로</button>
    </section>

    <!-- 주문서 화면 -->
    <section id="order-screen" class="screen">
      <div class="receipt-wrap">
        <div class="receipt">
          <p class="rc-shop">☕ 오늘의 한 잔</p>
          <p class="rc-sub">ORDER RECEIPT</p>
          <div class="rc-meta"><span>주문번호</span><span id="order-no"></span></div>
          <div class="rc-meta"><span>일시</span><span id="order-date"></span></div>
          <hr class="rc-line">
          <div class="rc-item">
            <span id="order-emoji" class="rc-emoji"></span>
            <strong id="order-name" class="rc-name"></strong>
            <span class="rc-qty">x 1</span>
          </div>
          <ul id="order-list" class="rc-options"></ul>
          <hr class="rc-line double">
          <p class="rc-thanks">맛있게 준비해 드릴게요</p>
          <p class="rc-thanks-en">THANK YOU · SEE YOU AGAIN</p>
          <div class="rc-barcode"></div>
          <p id="order-code" class="rc-code"></p>
        </div>
      </div>
      <button id="order-restart-btn" class="btn primary">다시 하기</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
